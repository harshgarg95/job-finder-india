name: Bug report
description: Something behaved wrongly, silently, or dishonestly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Never paste your `.env` keys, tokens, or résumé
        content here** — redact anything personal from logs before posting.
        Security vulnerabilities: use [private reporting](../../security/advisories/new)
        instead of a public issue (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
      placeholder: e.g. "discover reported 0 candidates, but I was offline — expected the loud network-failure message"
    validations:
      required: true
  - type: dropdown
    id: cli
    attributes:
      label: Which AI CLI were you running the prompt-pack in?
      options:
        - Claude Code
        - GitHub Copilot CLI
        - Codex (OpenAI)
        - OpenCode
        - Qwen
        - Antigravity
        - Not CLI-related (Python tool / dashboard / CI)
        - Other (say which below)
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model (if known)
      placeholder: e.g. Claude Sonnet, GPT-5, Copilot "Auto"
  - type: dropdown
    id: step
    attributes:
      label: Which step?
      options:
        - onboard (setup)
        - doctor
        - discover
        - prescreen
        - enrich / in-session scoring
        - tracker / top.md output
        - dashboard
        - live (liveness check)
        - CI workflows (tests / discovery-smoke)
        - other / not sure
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output / logs (keys and personal data REDACTED)
      description: Paste the command output or the JSON the tool printed. Redact keys, tokens, and résumé text.
      render: text
  - type: input
    id: env
    attributes:
      label: OS + Python version
      placeholder: e.g. macOS 15 / Python 3.13
